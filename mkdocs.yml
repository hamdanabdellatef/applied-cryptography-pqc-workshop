site_name: Applied Crypto Workshop
site_url: https://hamdanabdellatef.github.io/applied-cryptography-pqc-workshop/
repo_url: https://github.com/hamdanabdellatef/applied-cryptography-pqc-workshop
edit_uri: edit/main/docs/
hooks:
  - scripts/site_hooks.py
site_description: A practical workshop for developers and secure-system architects
docs_dir: docs
site_dir: site
theme:
  name: mkdocs
extra_css:
  - assets/stylesheets/course.css
extra_javascript:
  - assets/javascripts/mermaid-init.js
plugins:
  - search
markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
